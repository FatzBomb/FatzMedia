name: video-ci

# Private repository: hosted runner minutes are billed (Windows at 2x). Run once per change:
# for pull requests and for main, not again for every push to a PR branch. Changes that only
# touch documentation skip CI; run it by hand from the Actions tab when needed.
on:
  push:
    branches: [main]
    paths:
      - 'Video/**'
      # Only the Audio parts Video builds: the .NET binding and the native library.
      - 'Audio/bindings/dotnet/src/**'
      - 'Audio/src/**'
      - 'Audio/include/**'
      - 'Audio/third_party/**'
      - 'Audio/cmake/**'
      - 'Audio/CMakeLists.txt'
      - '!Video/docs/**'
      - '!**/*.md'
      - '.github/workflows/video-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Video/**'
      # Only the Audio parts Video builds: the .NET binding and the native library.
      - 'Audio/bindings/dotnet/src/**'
      - 'Audio/src/**'
      - 'Audio/include/**'
      - 'Audio/third_party/**'
      - 'Audio/cmake/**'
      - 'Audio/CMakeLists.txt'
      - '!Video/docs/**'
      - '!**/*.md'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# FatzMedia repo: this workflow builds Video/; every run step starts there.
defaults:
  run:
    working-directory: Video

jobs:
  build-and-validate:
    name: Build, test, and validate boundaries
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FatzMedia.Video.sln

      - name: Build (Release)
        run: dotnet build FatzMedia.Video.sln -c Release --no-restore

      - name: Test
        run: dotnet test FatzMedia.Video.sln -c Release --no-build --no-restore

      - name: Core boundary check
        shell: pwsh
        run: ./scripts/check-core-boundary.ps1

      - name: WPF boundary check
        shell: pwsh
        run: ./scripts/check-wpf-boundary.ps1

      - name: UI adapter boundary check
        shell: pwsh
        run: ./scripts/check-adapter-boundary.ps1

      - name: Presentation parity check
        shell: pwsh
        run: ./scripts/check-presentation-parity.ps1

      # ../Audio: FatzMedia.Audio comes in by project reference and keeps its own style.
      # Not blocking until the style cleanup: the shared style adopted in the migration flags ~6,000
      # existing lines (Video/ IDE0040, IDE0007). Remove continue-on-error with that cleanup.
      - name: Format check
        continue-on-error: true
        run: dotnet format FatzMedia.Video.sln --verify-no-changes --no-restore --exclude ../Audio

  linux-portable:
    name: Linux portable build and tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Mesa lavapipe (software Vulkan) and glslang for renderer checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 glslang-tools

      - name: Vulkan SPIR-V matches its GLSL source
        run: ./scripts/check-vulkan-shaders.sh

      # FatzMedia.Audio's native library for the FatzAudio engine tests (Linux.Tests), built from Audio/.
      - name: Build the FatzMedia.Audio native library
        working-directory: Audio
        run: |
          sudo apt-get install -y --no-install-recommends libasound2-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFA_BUILD_TESTS=OFF -DFA_BUILD_TOOLS=OFF
          cmake --build build --parallel "$(nproc)"
          echo "FatzAudioNativeDir=$GITHUB_WORKSPACE/Audio/build/bin" >> "$GITHUB_ENV"

      - name: Build portable, Linux, and Vulkan projects (Release)
        run: |
          dotnet build FatzMedia.Video.Portable.Tests/FatzMedia.Video.Portable.Tests.csproj -c Release
          dotnet build FatzMedia.Video.Linux.Tests/FatzMedia.Video.Linux.Tests.csproj -c Release
          dotnet build FatzMedia.Video.Vulkan.Tests/FatzMedia.Video.Vulkan.Tests.csproj -c Release
          dotnet build FatzMedia.Video.Avalonia.Tests/FatzMedia.Video.Avalonia.Tests.csproj -c Release
          dotnet build FatzMedia.Video.Sample.Player.Avalonia/FatzMedia.Video.Sample.Player.Avalonia.csproj -c Release -f net10.0

      - name: Portable tests
        run: dotnet test FatzMedia.Video.Portable.Tests/FatzMedia.Video.Portable.Tests.csproj -c Release --no-build

      - name: Linux platform tests
        run: dotnet test FatzMedia.Video.Linux.Tests/FatzMedia.Video.Linux.Tests.csproj -c Release --no-build

      - name: Vulkan renderer conformance (lavapipe)
        run: dotnet test FatzMedia.Video.Vulkan.Tests/FatzMedia.Video.Vulkan.Tests.csproj -c Release --no-build

      - name: Avalonia adapter tests (headless)
        run: dotnet test FatzMedia.Video.Avalonia.Tests/FatzMedia.Video.Avalonia.Tests.csproj -c Release --no-build
